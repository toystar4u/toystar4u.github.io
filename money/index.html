  <!--
    If you are serving your web app in a path other than the root, change the

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  <base href="/money/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="예금, 적금, 배당금 관리 앱">

  <!-- viewport-fit=cover lets the page use the full screen; the safe area is
       then handled explicitly through env(safe-area-inset-*) below. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- `default` keeps the status bar outside of the web view, so iOS paints it
       with the page background color (#app-chrome-color, kept in sync with the
       Flutter theme by lib/utils/web_chrome.dart). `black-translucent` would
       force light status bar text, which is unreadable in light theme. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Money">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Additional iOS optimizations -->
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Status bar / browser chrome color. Rewritten at runtime by WebChrome. -->
  <meta id="app-theme-color" name="theme-color" content="#FFFFFF">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Money Manager</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fallback colors for the first paint, before Flutter reports the real
       theme colors. Overwritten by WebChrome (lib/utils/web_chrome.dart). */

      --app-chrome-color: #FFFFFF;   /* app bar / status bar band */
      --app-surface-color: #FAFAFA;  /* scaffold background */
    }

    /* Prevent browser-level scrolling - Flutter handles all scrolling internally */
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      /* iOS samples this color for the standalone status bar band. */
      background-color: var(--app-chrome-color);
    }

    /* Flutter renders into this element instead of the whole page, so that:
       1. it can be inset by the iPhone home indicator / rounded corners
          (Flutter web always reports MediaQuery.padding == 0, so the safe area
          cannot be handled from Dart on web), and
       2. the engine sizes itself from a ResizeObserver on a real element
          instead of the window metrics, which are unreliable right after an
          iOS standalone launch and caused touch hit-testing to be offset. */

      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      /* --keyboard-inset is set from JS below while the soft keyboard is open. */
      bottom: max(env(safe-area-inset-bottom, 0px), var(--keyboard-inset, 0px));
      background-color: var(--app-surface-color);
      overflow: hidden;
    }

    /* Fills the home indicator strip so it blends with the app background. */
    #safe-area-bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: env(safe-area-inset-bottom, 0px);
      background-color: var(--app-surface-color);
      pointer-events: none;
    }
  </style>

  <script>
    // Pick sensible chrome colors before Flutter boots, so the status bar band
    // does not flash white on a dark themed device.
    (function () {
      try {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          var root = document.documentElement;
          root.style.setProperty('--app-chrome-color', '#1E1E1E');
          root.style.setProperty('--app-surface-color', '#121212');
          var meta = document.getElementById('app-theme-color');
          if (meta) { meta.setAttribute('content', '#1E1E1E'); }
        }
      } catch (e) { /* ignore */ }
    })();

    // Soft keyboard handling.
    //
    // Flutter reports MediaQuery.viewInsets == 0 when it renders into a custom
    // host element, so `resizeToAvoidBottomInset` cannot see the iOS keyboard.
    // Instead we shrink the host element itself: the visual viewport tells us
    // how much of the layout viewport the keyboard covers.
    (function () {
      var viewport = window.visualViewport;
      if (!viewport) { return; }

      // Safari's collapsing toolbars also change the visual viewport, so only
      // treat a clearly keyboard-sized difference as a keyboard.
      var kMinKeyboardHeight = 120;

      function apply() {
        var covered = window.innerHeight - viewport.height - viewport.offsetTop;
        var inset = covered > kMinKeyboardHeight ? Math.round(covered) : 0;
        document.documentElement.style.setProperty('--keyboard-inset', inset + 'px');
      }

      viewport.addEventListener('resize', apply);
      viewport.addEventListener('scroll', apply);
      apply();
    })();
  </script>
